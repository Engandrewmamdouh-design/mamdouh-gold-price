name: Update Gold Prices

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python gold_price_scraper.py

      - name: Commit updated prices
        run: |
          git config user.name "gold-price-bot"
          git config user.email "bot@example.com"
          git add gold_prices.json
          git diff --quiet --cached || git commit -m "تحديث سعر الذهب"
          git push
